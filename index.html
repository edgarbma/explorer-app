<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>explorer-app</title>
    <link rel="stylesheet" href="/src/style.css" />
    
  </head>
  <body class="flex min-h-screen w-full flex-col bg-surface-surface text-text-primary antialiased">

    <header class="w-full bg-surface-background">
      <div class="mx-auto flex w-[95%] max-w-none items-center justify-between px-4 py-5 sm:px-6 lg:px-8">
        <a href="#" class="text-3xl font-bold text-text-primary sm:text-3xl">Booking or browsing?</a>

        <button
          id="menu-toggle"
          class="flex size-11 items-center justify-center rounded-md border text-text-primary hover:bg-gray-200/50 md:hidden"
          aria-controls="main-menu"
          aria-expanded="false"
          aria-label="Abrir menú"
        >
          <svg class="size-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <nav
          id="main-menu"
          aria-label="Navegación principal"
          class="hidden w-full border-t pt-4 md:block md:w-auto md:border-0 md:pt-0"
        >
          <ul class="flex flex-col gap-3 md:flex-row md:items-center md:gap-6 text-sm">
            <li>
              <a href="#home" class="border-b-2 border-brand-accent pb-1 font-medium text-text-primary" aria-current="page">
                Home
              </a>
            </li>
            <li>
              <a href="#plans" class="pb-1 hover:border-b-2 hover:border-brand-accent text-text-primary">
                Explore Plans
              </a>
            </li>
            <li>
              <a href="#about" class="pb-1 hover:border-b-2 hover:border-brand-accent text-text-primary">
                About
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="inicio" class="flex-1 mx-auto w-[95%] max-w-none py-8">
      <section id="home-view">
        <div class="mb-6 sm:mb-8">
          <h1 class="font-primary text-2xl font-normal text-text-primary sm:text-4xl">
            Where will you go next?
          </h1>
          <p class="font-secondary mt-2 text-sm uppercase tracking-wide text-text-secondary sm:text-base">
            Find your country and use the available filters to explore its information.
          </p>
        </div>
        
        <div class="mb-8 flex flex-col gap-3 sm:mb-12 md:flex-row md:items-center md:gap-4">
          <div class="relative w-full">
            <img 
              src="/src/assets/icons/search.svg" 
              alt="Buscar" 
              class="pointer-events-none absolute left-4 top-1/2 z-10 size-5 -translate-y-1/2 opacity-60"
            />
            <input
              id="country-search"
              type="search"
              placeholder="Look for..."
              class="h-12 w-full rounded-full border border-gray-300 bg-white pl-12 pr-5 transition-colors duration-200 hover:border-blue-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-500"
            />
          </div>

          <select id="region-filter" class="h-12 w-full rounded-full border border-gray-300 bg-white px-4 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-500 md:w-54 md:shrink-0">
            <option value="">All regions</option>
            <option value="africa">Africa</option>
            <option value="americas">America</option>
            <option value="asia">Asia</option>
            <option value="europe">Europe</option>
            <option value="oceania">Oceania</option>
          </select>
        </div>

        <div id="paises">
          <h2 class="mb-6 text-xl font-bold text-text-primary sm:text-2xl">
            Suggested countries
          </h2>
          
          <section 
            id="countries-container"
            class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 lg:gap-8 xl:grid-cols-4" 
            aria-label="Country list">
          </section>
        </div>
      </section>

      <section id="detail-view" hidden aria-live="polite"></section>
    </main>


    <footer class="w-full bg-surface-background">
      <div class="mx-auto flex w-[95%] max-w-none items-center justify-between px-4 py-5 sm:px-6 lg:px-8">
        <div>
          <p class="text-3xl font-bold text-text-primary sm:text-3xl">Explorer App</p>
          <p class="text-xs text-text-secondary sm:text-sm">
            © 2026 Explorer App. Data provided by REST Countries.
          </p>
        </div>  

        <nav
          aria-label="Navegación del pie de página"
          class="hidden w-full border-t pt-4 md:block md:w-auto md:border-0 md:pt-0"
        >
          <ul class="flex flex-col gap-3 md:flex-row md:items-center md:gap-6 text-sm">
            <li>
              <a href="#documentation" class="pb-1 hover:border-b-2 hover:border-brand-accent text-text-primary">
                Documentation
              </a>
            </li>
            <li>
              <a href="#sourceCode" class="pb-1 hover:border-b-2 hover:border-brand-accent text-text-primary">
                Source Code
              </a>
            </li>
            <li>
              <a href="#privacy" class="pb-1 hover:border-b-2 hover:border-brand-accent text-text-primary">
                Privacy
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
